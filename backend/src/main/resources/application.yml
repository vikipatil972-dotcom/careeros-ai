spring:
  application:
    name: careeros-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careeros_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForCareerOsAiSecurityHardeningEnterprise2026SaaSKeyMustBeAtLeast256BitsLong}
  expiration-ms: 3600000

payment:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_live_default_key}
    key-secret: ${RAZORPAY_KEY_SECRET:rzp_live_default_secret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:whsec_live_default_secret}
  cashfree:
    app-id: ${CASHFREE_APP_ID:cf_live_app_id}
    secret-key: ${CASHFREE_SECRET_KEY:cf_live_secret_key}
  phonepe:
    merchant-id: ${PHONEPE_MERCHANT_ID:phonepe_merchant_123}
    salt-key: ${PHONEPE_SALT_KEY:phonepe_salt_key_123}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_live_stripe_secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
